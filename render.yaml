services:
  # Backend API Service
  - type: web
    name: task-manager-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString

databases:
  # Hosted PostgreSQL database instance on Render
  - name: task-manager-db
    databaseName: taskmaster
    user: taskmaster_user
    plan: free
